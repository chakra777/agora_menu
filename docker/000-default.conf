# 000-default.conf – Apache virtual host for Agora Menu
<VirtualHost *:80>
    # Document root inside the container
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Log to stdout/stderr (Railway captures these)
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
